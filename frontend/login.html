<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lagoa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=JetBrains+Mono&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">

<div class="lang-switch auth-lang" role="group" data-i18n-aria-label="language">
  <button type="button" data-lang="ru">RU</button>
  <button type="button" data-lang="en">EN</button>
</div>

<main class="auth-card">
  <div class="brand">
    <svg width="36" height="36" viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="14" stroke="#7FB3A8" stroke-width="1.6"/><path d="M7 15c2.2-2 4.4-2 6.6 0s4.4 2 6.6 0 3.3-1.4 4.8-.6" stroke="#E8956B" stroke-width="1.8" stroke-linecap="round"/><path d="M8.5 20c2-1.6 3.9-1.6 5.8 0s3.9 1.6 5.8 0" stroke="#7FB3A8" stroke-width="1.6" stroke-linecap="round"/></svg>
    <span class="brand-name">Lagoa</span>
    <span class="beta" data-i18n="beta"></span>
  </div>

  <div class="auth-head">
    <h1 id="authTitle"></h1>
    <p id="authSub"></p>
  </div>

  <form class="auth-form" id="authForm" novalidate>
    <div class="auth-tabs" role="tablist">
      <button type="button" role="tab" data-mode="login" data-i18n="signIn"></button>
      <button type="button" role="tab" data-mode="register" data-i18n="signUp"></button>
    </div>

    <div class="field">
      <label for="login" data-i18n="loginLabel"></label>
      <input id="login" name="login" autocomplete="username" required minlength="3" maxlength="64">
    </div>

    <div class="field">
      <label for="password" data-i18n="passwordLabel"></label>
      <input id="password" name="password" type="password" required minlength="8" maxlength="128">
      <span class="field-hint" id="passwordHint" data-i18n="passwordHint"></span>
    </div>

    <div class="auth-error" id="authError" role="alert" hidden></div>

    <button type="submit" class="auth-submit" id="authSubmit"></button>

    <p class="auth-switch">
      <span id="switchText"></span>
      <button type="button" id="switchBtn"></button>
    </p>
  </form>

  <p class="disclaimer" style="margin: 0" data-i18n="disclaimer"></p>
</main>

<script src="i18n.js"></script>
<script src="api.js"></script>
<script src="auth.js"></script>
</body>
</html>
