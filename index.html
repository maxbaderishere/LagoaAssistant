<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lagoa</title>
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --border: #e3e6ea;
    --text: #1d2125;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --user-bubble: #2563eb;
    --user-text: #ffffff;
    --bot-bubble: #ffffff;
    --code-bg: #f1f3f5;
    --error: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111315;
      --surface: #1a1d20;
      --border: #2a2e33;
      --text: #e6e8ea;
      --muted: #9aa1a9;
      --accent: #3b82f6;
      --user-bubble: #2f5fd0;
      --bot-bubble: #1f2327;
      --code-bg: #15181b;
      --error: #f87171;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  header h1 { font-size: 18px; margin: 0; }
  .status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: #16a34a; }
  .dot.fail { background: var(--error); }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
  }
  .chat {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .empty {
    text-align: center;
    color: var(--muted);
    margin-top: 20vh;
  }

  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 14px;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    color: var(--user-text);
    border-bottom-right-radius: 4px;
    white-space: pre-wrap;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg.error {
    align-self: flex-start;
    color: var(--error);
    border: 1px solid var(--error);
    background: transparent;
  }
  .msg.bot p { margin: 0 0 8px; }
  .msg.bot p:last-child { margin-bottom: 0; }
  .msg.bot ul, .msg.bot ol { margin: 4px 0 8px; padding-left: 22px; }
  .msg.bot h3, .msg.bot h4 { margin: 10px 0 6px; font-size: 15px; }
  .msg.bot code {
    background: var(--code-bg);
    padding: 1px 5px;
    border-radius: 4px;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 13px;
  }
  .msg.bot pre {
    background: var(--code-bg);
    padding: 10px 12px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 6px 0 8px;
  }
  .msg.bot pre code { background: none; padding: 0; }

  .typing span {
    display: inline-block;
    width: 7px; height: 7px;
    margin: 0 2px;
    border-radius: 50%;
    background: var(--muted);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  footer {
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 12px 16px;
  }
  form {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  textarea {
    flex: 1;
    resize: none;
    max-height: 200px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
    outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  button {
    padding: 10px 18px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-text);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .hint { max-width: 760px; margin: 6px auto 0; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
  <header>
    <h1>Lagoa</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="status">Подключение…</span></div>
  </header>

  <main id="scroll">
    <div class="chat" id="chat">
      <div class="empty" id="empty">Задайте вопрос нейросети</div>
    </div>
  </main>

  <footer>
    <form id="form">
      <textarea id="input" rows="1" placeholder="Ваш вопрос…" autofocus></textarea>
      <button type="submit" id="send">Отправить</button>
    </form>
    <div class="hint">Enter — отправить, Shift+Enter — новая строка</div>
  </footer>

<script>
  const API_URL = "http://localhost:8000";

  const chat = document.getElementById("chat");
  const scroll = document.getElementById("scroll");
  const empty = document.getElementById("empty");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const dot = document.getElementById("dot");
  const statusText = document.getElementById("status");

  function setStatus(ok, text) {
    dot.className = "dot " + (ok ? "ok" : "fail");
    statusText.textContent = text;
  }

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // Minimal markdown: code blocks, inline code, headings, lists, bold, italics.
  function renderMarkdown(text) {
    const blocks = [];
    text = text.replace(/```[^\n]*\n([\s\S]*?)```/g, (_, code) => {
      blocks.push("<pre><code>" + escapeHtml(code.replace(/\n$/, "")) + "</code></pre>");
      return "\u0000" + (blocks.length - 1) + "\u0000";
    });

    const inline = s => escapeHtml(s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*\s][^*]*?)\*/g, "$1<em>$2</em>");

    const out = [];
    let list = null;
    let para = [];
    const flushPara = () => { if (para.length) { out.push("<p>" + para.join("<br>") + "</p>"); para = []; } };
    const flushList = () => { if (list) { out.push(`<${list.tag}>${list.items.join("")}</${list.tag}>`); list = null; } };

    for (const line of text.split("\n")) {
      const block = line.match(/^\u0000(\d+)\u0000$/);
      const heading = line.match(/^#{1,6}\s+(.*)$/);
      const ul = line.match(/^\s*[-*]\s+(.*)$/);
      const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);

      if (block) { flushPara(); flushList(); out.push(blocks[+block[1]]); }
      else if (heading) { flushPara(); flushList(); out.push("<h4>" + inline(heading[1]) + "</h4>"); }
      else if (ul || ol) {
        flushPara();
        const tag = ul ? "ul" : "ol";
        if (!list || list.tag !== tag) { flushList(); list = { tag, items: [] }; }
        list.items.push("<li>" + inline((ul || ol)[1]) + "</li>");
      }
      else if (!line.trim()) { flushPara(); flushList(); }
      else { flushList(); para.push(inline(line)); }
    }
    flushPara(); flushList();
    return out.join("");
  }

  function addMessage(role, text) {
    empty.remove();
    const el = document.createElement("div");
    el.className = "msg " + role;
    if (role === "bot") el.innerHTML = renderMarkdown(text);
    else el.textContent = text;
    chat.appendChild(el);
    scroll.scrollTop = scroll.scrollHeight;
    return el;
  }

  function addTyping() {
    const el = addMessage("bot", "");
    el.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    return el;
  }

  async function loadHistory() {
    try {
      const res = await fetch(`${API_URL}/requests`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const items = await res.json();
      for (const item of items) {
        addMessage("user", item.promt);
        addMessage("bot", item.response);
      }
      setStatus(true, "API подключено");
    } catch (e) {
      setStatus(false, "API недоступно");
      console.error(e);
    }
  }

  async function sendPrompt(prompt) {
    addMessage("user", prompt);
    const typing = addTyping();
    sendBtn.disabled = true;
    try {
      const res = await fetch(`${API_URL}/requests`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt }),
      });
      if (!res.ok) throw new Error(`Сервер вернул ошибку ${res.status}`);
      const data = await res.json();
      typing.innerHTML = renderMarkdown(data.answer ?? "");
      setStatus(true, "API подключено");
    } catch (e) {
      typing.className = "msg error";
      typing.textContent = e instanceof TypeError
        ? "Не удалось связаться с API. Запущен ли сервер на localhost:8000?"
        : e.message;
      setStatus(false, "Ошибка запроса");
    } finally {
      sendBtn.disabled = false;
      scroll.scrollTop = scroll.scrollHeight;
      input.focus();
    }
  }

  function autoResize() {
    input.style.height = "auto";
    input.style.height = input.scrollHeight + "px";
  }

  input.addEventListener("input", autoResize);
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  form.addEventListener("submit", e => {
    e.preventDefault();
    const prompt = input.value.trim();
    if (!prompt || sendBtn.disabled) return;
    input.value = "";
    autoResize();
    sendPrompt(prompt);
  });

  loadHistory();
</script>
</body>
</html>
