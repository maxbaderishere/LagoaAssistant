[project]
name = "python-pet-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Maksim Bader-Baer", email = "maksim.bader@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.15.0",
    "dotenv>=0.9.9",
    "fastapi>=0.143.0",
    "google-genai>=2.30.0",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
python-pet-project = "python_pet_project:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
